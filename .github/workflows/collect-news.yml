name: Collect RSS News

on:
  workflow_dispatch:
    inputs:
      reports:
        description: "Geminiでレポートを生成する（API利用料が発生する場合があります）"
        type: boolean
        default: false
      report_type:
        description: "レポートの対象期間"
        type: choice
        options: [daily, weekly, monthly]
        default: daily
      verify:
        description: "採用記事をGoogle検索で検証する"
        type: boolean
        default: false
      discover:
        description: "公開RSSの候補をGoogle検索で発見する"
        type: boolean
        default: false
      deliver:
        description: "設定済みのGoogle DriveとDiscordへ送信する"
        type: boolean
        default: false
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      ENABLE_WEB_VERIFICATION: ${{ inputs.verify }}
      ENABLE_SOURCE_DISCOVERY: ${{ inputs.discover }}
      ENABLE_DRIVE_SYNC: ${{ inputs.deliver && vars.ENABLE_DRIVE_SYNC == 'true' }}
      ENABLE_DISCORD_NOTIFY: ${{ inputs.deliver && vars.ENABLE_DISCORD_NOTIFY == 'true' }}
      DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
      DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
      DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Collect RSS and Atom feeds
        run: node scripts/collect-static-news.mjs
      - name: Generate research report
        if: ${{ inputs.reports }}
        env:
          REPORT_TYPE: ${{ inputs.report_type }}
        run: node scripts/research/run.mjs --type="$REPORT_TYPE"
      - name: Discover public feed candidates
        if: ${{ inputs.discover }}
        run: node scripts/research/run.mjs --discover
      - name: Commit refreshed news data
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/data/news.json pages/data/feeds.json pages/reports research/state.json
          git diff --cached --quiet || git commit -m "chore: refresh news feed"
          git push
