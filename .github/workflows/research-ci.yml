name: Verify RSS Research
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "research/**"
      - ".github/workflows/research-ci.yml"
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/research/research.test.mjs
      - run: node scripts/research/run.mjs --dry-run
